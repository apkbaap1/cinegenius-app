<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { width: 960px; height: 170px; }
  #btn { left: 0; top: 10px; width: 960px; height: 150px; padding: 0 40px; display: flex; align-items: center; gap: 28px; overflow: hidden; }
  #label { font-size: 50px; font-weight: 800; flex: none; width: 330px; }
  #track { flex: 1; height: 22px; border-radius: 11px; background: rgba(255,255,255,0.12); overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--gold); }
  #pct { font-family: "Mono", monospace; font-size: 34px; color: var(--muted); width: 120px; text-align: right; }
</style>
</head>
<body>
<div id="btn" class="abs card"><div id="label">Export ↓</div><div id="track"><div id="fill"></div></div><div id="pct">0%</div></div>
<script type="module">
import { span, outCubic, enter, fontsReady } from "./shared.js";
const $ = (id) => document.getElementById(id);
window.film = {
  duration: 1.6, width: 960, height: 170,
  ready: fontsReady(),
  frame(t) {
    enter($("btn"), t, 0, { end: 1.6, dist: 30, dur: 0.3 });
    const press = span(t, 0.6, 0.8);
    $("label").style.transform = `scale(${1 - 0.08 * Math.sin(Math.PI * press)})`;
    const p = outCubic(span(t, 0.75, 1.35));
    $("fill").style.width = `${p * 100}%`;
    const done = t >= 1.35;
    $("pct").textContent = done ? "✓" : `${Math.round(p * 100)}%`;
    $("pct").style.color = done ? "var(--green)" : "var(--muted)";
    $("label").textContent = done ? "Exported" : "Export ↓";
  },
};
</script>
</body>
</html>
