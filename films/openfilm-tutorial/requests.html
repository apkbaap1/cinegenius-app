<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { width: 960px; height: 400px; }
  #list { left: 0; top: 0; width: 960px; height: 400px; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; gap: 18px; padding-bottom: 10px; }
  .msg { display: flex; align-items: center; gap: 22px; padding: 24px 32px; border-radius: 34px 34px 10px 34px; background: var(--gold); color: #14161c; font-size: 44px; font-weight: 700; box-shadow: 0 20px 50px rgba(0,0,0,0.45); }
  .msg i { width: 50px; height: 50px; border-radius: 50%; background: #14161c; color: var(--green); font-style: normal; font-size: 32px; display: grid; place-items: center; }
</style>
</head>
<body>
<div id="list" class="abs">
  <div class="msg" data-at="0"><span>Make the title longer</span><i>✓</i></div>
  <div class="msg" data-at="2.25"><span>Swap shots 2 and 3</span><i>✓</i></div>
  <div class="msg" data-at="4.25"><span>Speed up the intro</span><i>✓</i></div>
</div>
<script type="module">
import { span, outBack, enter, fontsReady } from "./shared.js";
const msgs = [...document.querySelectorAll(".msg")];
const list = document.getElementById("list");
window.film = {
  duration: 5.2, width: 960, height: 400,
  ready: fontsReady(),
  frame(t) {
    msgs.forEach((m) => {
      const at = +m.dataset.at;
      enter(m, t, at, { dist: 40 });
      // A bubble takes room only once it appears, so earlier ones are pushed up.
      m.style.display = t >= at ? "flex" : "none";
      const tick = span(t, at + 0.6, at + 0.85);
      const check = m.querySelector("i");
      check.style.opacity = tick;
      check.style.transform = `scale(${0.4 + 0.6 * outBack(tick)})`;
    });
    list.style.opacity = 1 - span(t, 4.9, 5.2);
  },
};
</script>
</body>
</html>
