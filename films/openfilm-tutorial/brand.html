<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  #wrap { left: 0; top: 440px; width: 1080px; display: flex; flex-direction: column; align-items: center; }
  #icon { width: 230px; height: 230px; }
  #word { margin-top: 50px; font-size: 150px; font-weight: 800; letter-spacing: -0.045em; display: flex; }
  #word span { display: inline-block; }
  #word .f { color: var(--gold); }
  #plus { margin-top: 70px; display: flex; align-items: center; gap: 26px; font-size: 48px; font-weight: 700; }
  #pill { padding: 22px 40px; border-radius: 999px; border: 2px solid var(--gold); color: var(--gold); }
  #plus small { font-size: 48px; color: var(--muted); font-weight: 500; }
</style>
</head>
<body class="stage">
<div id="wrap" class="abs">
  <svg id="icon" viewBox="0 0 100 100">
    <rect x="8" y="14" width="84" height="72" rx="16" fill="#ffc531"/>
    <g fill="#0a0c11"><rect x="16" y="22" width="8" height="8" rx="2"/><rect x="16" y="46" width="8" height="8" rx="2"/><rect x="16" y="70" width="8" height="8" rx="2"/>
      <rect x="76" y="22" width="8" height="8" rx="2"/><rect x="76" y="46" width="8" height="8" rx="2"/><rect x="76" y="70" width="8" height="8" rx="2"/>
      <path d="M42 36 L62 50 L42 64 Z"/></g>
  </svg>
  <div id="word"></div>
  <div id="plus"><small>a skill for</small><span id="pill">Claude</span></div>
</div>
<script type="module">
import { span, outCubic, outBack, enter, fontsReady } from "./shared.js";
const $ = (id) => document.getElementById(id);
const letters = [..."OpenFilm"].map((ch, i) => {
  const s = document.createElement("span");
  s.textContent = ch;
  if (i >= 4) s.className = "f";
  $("word").appendChild(s);
  return s;
});

window.film = {
  duration: 3.65,
  ready: fontsReady(),
  frame(t) {
    const m = span(t, 0, 0.45);
    $("icon").style.opacity = Math.min(1, m * 3);
    $("icon").style.transform = `scale(${outBack(m)}) rotate(${(1 - outCubic(m)) * -14}deg)`;
    letters.forEach((s, i) => {
      const p = outCubic(span(t, 0.15 + i * 0.035, 0.55 + i * 0.035));
      s.style.opacity = p;
      s.style.transform = `translateY(${(1 - p) * 70}px)`;
    });
    enter($("plus"), t, 1.5, { dist: 30 });
    $("wrap").style.transform = `scale(${1 + 0.025 * span(t, 0, 3.65)})`;
  },
};
</script>
</body>
</html>
