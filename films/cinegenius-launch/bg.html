<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { background: var(--ink); }
  .glow { position: absolute; border-radius: 50%; filter: blur(120px); }
  #g1 { width: 900px; height: 900px; background: #3b2a12; }
  #g2 { width: 800px; height: 800px; background: #10303a; }
  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.6) 100%); }
</style>
</head>
<body>
<div class="glow" id="g1"></div>
<div class="glow" id="g2"></div>
<div id="grid"></div>
<div id="vignette"></div>
<script type="module">
const g1 = document.getElementById("g1"), g2 = document.getElementById("g2"), grid = document.getElementById("grid");
window.film = {
  duration: 24,
  frame(t) {
    g1.style.transform = `translate(${-200 + 260 * Math.sin(t * 0.18)}px, ${-250 + 120 * Math.cos(t * 0.22)}px)`;
    g2.style.transform = `translate(${1250 + 200 * Math.cos(t * 0.15)}px, ${450 + 140 * Math.sin(t * 0.2)}px)`;
    grid.style.backgroundPosition = `${-t * 6}px ${-t * 3}px`;
  },
};
</script>
</body>
</html>
