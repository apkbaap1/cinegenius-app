<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { width: 420px; height: 470px; }
  #me { left: 30px; top: 10px; width: 360px; height: 360px; border-radius: 50%; background: url(assets/ashok.jpg) center/cover;
    border: 10px solid var(--gold); box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
  #tag { left: 0; width: 420px; top: 385px; display: flex; justify-content: center; }
  #tag span { padding: 12px 26px; border-radius: 999px; background: #12141a; border: 2px solid var(--line); font-family: "Mono", monospace; font-size: 28px; }
  #tag b { color: var(--gold); font-weight: 500; }
</style>
</head>
<body>
<div id="me" class="abs"></div>
<div id="tag" class="abs"><span><b>@</b>ashokkumar.ai</span></div>
<script type="module">
import { span, outBack, fontsReady } from "./shared.js";
const me = document.getElementById("me"), tag = document.getElementById("tag");
window.film = {
  duration: 47, width: 420, height: 470,
  ready: fontsReady(),
  frame(t) {
    const p = span(t, 0.2, 0.7);
    // A gentle bob and tilt, so the badge feels alive without pulling focus.
    me.style.opacity = tag.style.opacity = Math.min(1, p * 2) * (1 - span(t, 46.7, 47));
    me.style.transform = `scale(${outBack(p)}) translateY(${6 * Math.sin(t * 2.4)}px) rotate(${2 * Math.sin(t * 1.3)}deg)`;
  },
};
</script>
</body>
</html>
