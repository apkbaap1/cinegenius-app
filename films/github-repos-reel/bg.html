<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { background: var(--ink); }
  .glow { position: absolute; border-radius: 50%; filter: blur(140px); }
  #g1 { width: 900px; height: 900px; background: rgba(255,197,49,0.18); }
  #g2 { width: 800px; height: 800px; background: rgba(70,120,255,0.16); }
  #grid { position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.09) 2px, transparent 2.5px); background-size: 48px 48px; }
</style>
</head>
<body class="stage">
<div class="glow" id="g1"></div><div class="glow" id="g2"></div><div id="grid"></div>
<script type="module">
const g1 = document.getElementById("g1"), g2 = document.getElementById("g2"), grid = document.getElementById("grid");
window.film = {
  duration: 52.7,
  frame(t) {
    g1.style.transform = `translate(${-300 + 200 * Math.sin(t * 0.21)}px, ${-200 + 160 * Math.cos(t * 0.17)}px)`;
    g2.style.transform = `translate(${500 + 160 * Math.cos(t * 0.19)}px, ${1100 + 180 * Math.sin(t * 0.23)}px)`;
    grid.style.backgroundPosition = `0 ${-t * 12}px`;
  },
};
</script>
</body>
</html>
