<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  #big { left: 70px; top: 140px; display: flex; align-items: center; gap: 30px; }
  #nine { width: 220px; height: 240px; border-radius: 48px; background: var(--gold); color: #12141a; display: grid; place-items: center; font-size: 200px; font-weight: 800; letter-spacing: -0.05em; }
  #gh { font-size: 96px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.98; }
  #line { left: 70px; top: 440px; width: 940px; font-size: 62px; font-weight: 800; line-height: 1.25; }
  #line em { font-style: normal; color: var(--gold); }
  #price { left: 70px; top: 650px; display: flex; align-items: baseline; gap: 20px; }
  #price b { font-size: 120px; font-weight: 800; letter-spacing: -0.04em; color: var(--red); text-decoration: line-through; text-decoration-thickness: 10px; }
  #price span { font-size: 48px; font-weight: 800; color: var(--green); }
  #tiles { left: 70px; top: 860px; width: 940px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .t { height: 110px; border-radius: 26px; background: var(--panel); border: 2px solid var(--line); display: flex; align-items: center; gap: 18px; padding: 0 20px; font-size: 30px; font-weight: 700; }
  .t i { width: 66px; height: 66px; border-radius: 18px; background: var(--gold); color: #12141a; font-style: normal; display: grid; place-items: center; font-size: 28px; font-weight: 800; flex: none; }
</style>
</head>
<body class="stage">
<div id="big" class="abs"><div id="nine">9</div><div id="gh">GitHub<br>repos</div></div>
<div id="line" class="abs">Paid software → <em>free</em> replacements</div>
<div id="price" class="abs"><b>$1,000s</b><span>→ $0</span></div>
<div id="tiles" class="abs"></div>
<script type="module">
import { ITEMS } from "./items.js";
import { span, enter, fontsReady } from "./shared.js";
const $ = (id) => document.getElementById(id);
const tiles = ITEMS.map((it) => {
  const d = document.createElement("div");
  d.className = "t";
  d.innerHTML = `<i>${it.mono}</i>${it.free}`;
  $("tiles").appendChild(d);
  return d;
});

window.film = {
  duration: 3.8,
  ready: fontsReady(),
  frame(t) {
    // Up from the first frame: it is the thumbnail.
    enter($("big"), t, -1, { end: 3.8 });
    enter($("line"), t, -1, { end: 3.8 });
    enter($("price"), t, 0.9, { pop: true, end: 3.8 });
    tiles.forEach((d, i) => enter(d, t, 1.3 + i * 0.12, { pop: true, dist: 30, end: 3.8 }));
    $("nine").style.transform = `rotate(${-4 + 4 * Math.sin(t * 2.2)}deg)`;
  },
};
</script>
</body>
</html>
